name: Release
# A tag like v1.2.0 builds the game for macOS (signed, notarized and
# stapled, as a disk image), Windows and Linux, and attaches all three to a
# GitHub release. Run it by hand with a version to build without tagging.
#
# Secrets the macOS job needs (the same names as the Front Porch repo, so
# they can be copied across):
#   MACOS_CERTIFICATE        base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PWD    its password
#   MACOS_CERTIFICATE_NAME   the identity, "Developer ID Application: Name (TEAMID)"
#   APPLE_TEAM_ID
#   APPLE_API_KEY            App Store Connect API key (.p8 contents or base64)
#   APPLE_API_KEY_ID
#   APPLE_API_ISSUER
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp, like 1.2.0
        required: true
permissions:
  contents: write
env:
  GODOT_VERSION: "4.7.2"
  APP: ParAndParcel
jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building $V"

  linux:
    name: Linux
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"
      - name: Stamp the version
        run: tools/stamp_version.sh "${{ needs.version.outputs.version }}"
      - name: Export
        run: |
          set -eo pipefail
          mkdir -p build
          godot --headless --path . --import >/dev/null 2>&1 || true
          godot --headless --path . --export-release "Linux" build/$APP.x86_64 2>&1 | grep -v "ObjectDB\|still in use\|^\[ *[0-9]*% \]\|savepack" || true
          test -s build/$APP.x86_64
      - name: Tarball
        run: |
          V="${{ needs.version.outputs.version }}"
          cd build && chmod +x $APP.x86_64 && tar czf "$APP-$V-linux-x86_64.tar.gz" $APP.x86_64 && ls -la
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          ID=com.antigravity.parandparcel
          D=build/AppDir
          mkdir -p $D/usr/bin $D/usr/share/applications $D/usr/share/metainfo $D/usr/share/icons/hicolor/512x512/apps
          cp build/$APP.x86_64 $D/usr/bin/parandparcel
          chmod +x $D/usr/bin/parandparcel
          cp packaging/$ID.desktop $D/usr/share/applications/$ID.desktop
          cp packaging/$ID.desktop $D/$ID.desktop
          cp packaging/$ID.metainfo.xml $D/usr/share/metainfo/$ID.metainfo.xml
          cp icon.png $D/usr/share/icons/hicolor/512x512/apps/$ID.png
          cp icon.png $D/$ID.png
          ln -sf $ID.png $D/.DirIcon
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/parandparcel" "$@"\n' > $D/AppRun
          chmod +x $D/AppRun
          curl -sSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --no-appstream $D "build/$APP-$V-x86_64.AppImage"
          ls -la build/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/*.tar.gz
            build/*.AppImage

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"
      - name: Stamp the version
        run: tools/stamp_version.sh "${{ needs.version.outputs.version }}"
      - name: rcedit, so the exe gets its icon and version info
        run: |
          set -euo pipefail
          mkdir -p ~/tools
          curl -sSL -o ~/tools/rcedit-x64.exe "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          RC="$(cygpath -m ~/tools/rcedit-x64.exe)"
          mkdir -p "$APPDATA/Godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/windows/rcedit = "%s"\n' "$RC" > "$APPDATA/Godot/editor_settings-4.7.tres"
          cat "$APPDATA/Godot/editor_settings-4.7.tres"
      - name: Export
        run: |
          set -eo pipefail
          mkdir -p build
          godot --headless --path . --import >/dev/null 2>&1 || true
          godot --headless --path . --export-release "Windows Desktop" build/$APP.exe 2>&1 | grep -v "ObjectDB\|still in use\|^\[ *[0-9]*% \]\|savepack" || true
          test -s build/$APP.exe
          ls -la build
      - name: Zip
        run: |
          V="${{ needs.version.outputs.version }}"
          cd build && 7z a -tzip "$APP-$V-windows-x86_64.zip" $APP.exe >/dev/null && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/*.zip

  mac:
    name: macOS, signed and notarized
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"
      - name: Stamp the version
        run: tools/stamp_version.sh "${{ needs.version.outputs.version }}"
      - name: Disk image tooling
        run: brew install create-dmg >/dev/null
      - name: Mask secrets in the log
        run: |
          echo "::add-mask::${{ secrets.MACOS_CERTIFICATE_NAME }}"
          echo "::add-mask::${{ secrets.APPLE_TEAM_ID }}"
          echo "::add-mask::${{ secrets.APPLE_API_KEY_ID }}"
          echo "::add-mask::${{ secrets.APPLE_API_ISSUER }}"
      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KC"
          security list-keychain -d user -s "$KC" login.keychain
          security find-identity -v -p codesigning | sed 's/[0-9A-F]\{40\}/<hash>/'
      - name: Export
        run: |
          set -eo pipefail
          mkdir -p build
          godot --headless --path . --import >/dev/null 2>&1 || true
          godot --headless --path . --export-release "macOS" build/$APP.zip 2>&1 | grep -v "ObjectDB\|still in use\|^\[ *[0-9]*% \]\|savepack" || true
          test -s build/$APP.zip
      - name: Sign, notarize and staple
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          V="${{ needs.version.outputs.version }}"
          tools/mac_release.sh build/$APP.zip "build/$APP-$V-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/*.dmg

  publish:
    name: GitHub release
    needs: [version, linux, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.version.outputs.version }}"
          TAG="${GITHUB_REF_TYPE}" ; [ "$TAG" = "tag" ] && TAG="$GITHUB_REF_NAME" || TAG="v$V"
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Par & Parcel $V" --generate-notes
          fi
